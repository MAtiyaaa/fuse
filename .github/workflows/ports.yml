# Fuse Ports' nightly check: every port's Linux build in ports/index.json is downloaded, compared
# with the list's size and SHA-256, unpacked the way Fuse unpacks it, and started without the
# game's files (tools/ports/check.py). Each night on main, the list is then marked with what
# passed and signed with the Ed25519 key in the PORTS_SIGNING_KEY secret, and put on the `ports`
# pre-release, where Fuse looks for it. Without the secret, nothing is signed or published, and the
# summary says so. When a port didn't start (or the check didn't finish), the night's run opens an
# issue labelled ports-broken, or adds to the one open, and closes it once every port starts again.
# On a pull request that changes the list or the tool, only the check runs. The native job checks
# the PlayStation ports Fuse finds (ports/native.json) the same nights.

name: Ports

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "ports/**"
      - "tools/ports/**"
      - ".github/workflows/ports.yml"

permissions:
  contents: read

concurrency:
  group: ports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Every port installs and starts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # A virtual screen for the ports that open a window, and SDL2, which fallout2-ce takes from the system.
      - name: Install a virtual screen and SDL2
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libsdl2-2.0-0 libsdl2-image-2.0-0

      - name: Test the check itself
        working-directory: tools/ports
        run: python3 -m unittest discover -s tests -v

      - name: Check every port
        run: |
          set -euo pipefail
          mkdir -p build/ports
          xvfb-run -a python3 tools/ports/check.py check --index ports/index.json --out build/ports/results-linux.json
          python3 - <<'EOF'
          import json
          r = json.load(open("build/ports/results-linux.json"))
          lines = ["| Port | Started | What was seen |", "|---|---|---|"]
          lines += [f"| {k} | {'yes' if v['passed'] else 'no'} | {v['detail'].replace('|', '/')} |" for k, v in sorted(r.items())]
          open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          EOF

      - name: Keep the results
        uses: actions/upload-artifact@v7
        with:
          name: ports-results
          path: build/ports/results-linux.json
          if-no-files-found: error
          retention-days: 14

  # The PlayStation games' native ports Fuse finds (ports/native.json): each project's newest release
  # still has its builds by name, and its zips still hold the files Fuse finds the port by. Apart
  # from the list above: nothing of theirs is installed by Fuse, signed or published. A night that
  # finds one changed opens an issue labelled native-port-changed, closed once every one checks again.
  native:
    name: The PlayStation ports Fuse finds are where it looks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check every project's newest release
        id: native
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p build/ports
          python3 tools/ports/native_check.py --list ports/native.json --out build/ports/native.json
          status=$?
          python3 - <<'EOF'
          import json
          r = json.load(open("build/ports/native.json"))
          lines = ["| Port | Found as expected | Newest release |", "|---|---|---|"]
          lines += [f"| {k} | {'yes' if v['passed'] else 'no'} | {v['detail'].replace('|', '/')} |" for k, v in sorted(r.items())]
          open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          EOF
          echo "failed=$([ $status -eq 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open, add to or close the issue
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ steps.native.outputs.failed }}
        run: |
          set -euo pipefail
          open=$(gh issue list --state open --label native-port-changed --json number --jq '.[0].number // empty')
          if [ "$FAILED" = "true" ]; then
            body="A project's newest release no longer matches how Fuse finds it (ports/native.json, core:launch PsPorts): $RUN_URL"
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh label create native-port-changed --color D93F0B --description "A native port's release changed from what Fuse finds" 2>/dev/null || true
              gh issue create --title "A native port's release changed" --label native-port-changed --body "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Every native port is found as expected again: $RUN_URL"
          fi

  report:
    name: Open an issue when a port breaks
    needs: check
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Missing when the check didn't finish, which the issue then says.
      - name: Get the results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ports-results
          path: build/ports

      - name: Open, add to or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p build/ports
          python3 tools/ports/check.py report --results build/ports/results-linux.json --out build/ports/issue.md --run-url "$RUN_URL"
          open=$(gh issue list --state open --label ports-broken --json number --jq '.[0].number // empty')
          if [ -s build/ports/issue.md ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file build/ports/issue.md
            else
              gh label create ports-broken --color B60205 --description "A port didn't start in the nightly check" 2>/dev/null || true
              gh issue create --title "A port didn't start in the nightly check" --label ports-broken --body-file build/ports/issue.md
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Every port started again in the nightly check: $RUN_URL"
          fi

  publish:
    name: Sign and publish the list
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Get the results
        uses: actions/download-artifact@v8
        with:
          name: ports-results
          path: build/ports

      - name: Mark and sign the list
        id: sign
        env:
          PORTS_SIGNING_KEY: ${{ secrets.PORTS_SIGNING_KEY }}
        run: |
          set -euo pipefail
          python3 tools/ports/check.py publish --index ports/index.json --results build/ports/results-linux.json --out build/ports/out
          if [ -f build/ports/out/index.json.sig ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "The PORTS_SIGNING_KEY secret isn't set, so the list wasn't signed or published. Fuse shows no port as verified until it is." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A pre-release, never the latest: Fuse's own update checks pass the `ports` tag over.
      - name: Put the list on the ports release
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view ports >/dev/null 2>&1; then
            gh release create ports --prerelease --latest=false --title "Fuse Ports list" \
              --notes "The signed list of ports Fuse checks for (made each night by the Ports workflow). Not a version of Fuse."
          fi
          gh release upload ports build/ports/out/index.json build/ports/out/index.json.sig --clobber
