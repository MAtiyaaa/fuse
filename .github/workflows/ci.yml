# Runs every test suite (core, store, UI flows, both apps) and builds the Android debug APK for every pull
# request and every push to a branch other than main. Linux builds the AppImage, and Windows and
# macOS (Apple silicon and Intel) run the shared and desktop tests and build their packages; each
# package is started with Fuse's --self-test, and kept as an artifact to try. Releases are handled
# by release.yml.

name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check the release files agree
        run: scripts/check-release.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37
        # compileSdk 37 is the "platforms;android-37.0" package. AGP downloads any other build tools
        # it needs, since the SDK licences were accepted above.
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # A recompiled PS5 game plays inside bubblewrap with the dump read-only, as on SteamOS, which has
      # it; DesktopPortFilesTest runs one there. Ubuntu lets only programs it knows make a sandbox.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Shared modules have a JVM target named "desktop", so their commonTest and desktopTest
      # sources run in the desktopTest task (see build-logic/src/main/kotlin/fuse.kmp.library.gradle.kts).
      - name: Test everything, build the debug APK and check the release build shrinks
        run: >-
          ./gradlew --refresh-dependencies --stacktrace
          :core:model:desktopTest
          :core:library:desktopTest
          :core:launch:desktopTest
          :core:integrations:desktopTest
          :core:data:desktopTest
          :core:sync:desktopTest
          :core:jellyfin:desktopTest
          :core:playback:desktopTest
          :core:transfer:desktopTest
          :core:romm:desktopTest
          :core:reach:desktopTest
          :ui:fuseline:desktopTest
          :ui:player:desktopTest
          :ui:shell:desktopTest
          :ui:designsystem:desktopTest
          :ui:link:desktopTest
          :app:android:testDebugUnitTest
          :app:android:assembleDebug
          :app:android:minifyReleaseWithR8
          :app:desktop:test
          :app:host:test
          :app:host:installDist
          :tools:tune:test

      # Timed alone, once every other test above has finished: beside them it measures them, not Fuse.
      - name: Time Fast Start
        run: ./gradlew --stacktrace :app:desktop:fastStartTiming

      # The Fuse One Host image builds from what installDist made (nothing is pushed here).
      - name: Build the Fuse One Host image
        run: |
          set -euo pipefail
          docker build -f tools/host/Dockerfile -t fuse-one-host:ci .
          docker run --rm --entrypoint fuse-one-host fuse-one-host:ci version
          sh -n tools/host/install.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: fuse-debug-apk
          path: app/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The AppImage carries the Java runtime it is built with: 21, as release.yml builds it.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Gradle configures every module, including the Android ones, so the desktop build needs the SDK too.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37
        run: sdkmanager --install "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Without the class data sharing archive (it needs a virtual screen and only speeds up starts);
      # the script ends by starting the AppImage itself with --self-test.
      - name: Build the AppImage and self-test it
        env:
          SKIP_CDS: "1"
        run: bash scripts/build-appimage.sh

      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: fuse-linux
          path: build/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  decky:
    name: Decky plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/decky/fuse
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Type-check and build the plugin
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npx tsc --noEmit
          npx rollup -c
          python3 -c "import ast; ast.parse(open('main.py').read())"
          python3 -m unittest discover -s tests -v

      - name: Package the plugin as Decky installs it
        run: |
          mkdir -p out/Fuse
          cp -r plugin.json package.json main.py README.md dist out/Fuse/
          cd out && zip -qr Fuse.zip Fuse

      - name: Upload the plugin
        uses: actions/upload-artifact@v7
        with:
          name: fuse-decky-plugin
          path: tools/decky/fuse/out/Fuse.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37
        # sdkmanager is a .bat file, which bash doesn't run by its bare name.
        shell: pwsh
        run: sdkmanager --install "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test the shared and desktop code
        run: ./gradlew --refresh-dependencies --stacktrace :core:library:desktopTest :core:launch:desktopTest :ui:fuseline:desktopTest :app:desktop:test

      - name: Build the installer and zip, and self-test them
        run: bash scripts/build-windows.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-windows
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the Windows builds
        uses: actions/upload-artifact@v7
        with:
          name: fuse-windows
          path: build/windows/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37
        run: sdkmanager --install "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test the shared and desktop code
        run: ./gradlew --refresh-dependencies --stacktrace :core:library:desktopTest :core:launch:desktopTest :ui:fuseline:desktopTest :app:desktop:test

      - name: Build the disk image and self-test the app
        run: bash scripts/build-macos.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-macos-${{ matrix.arch }}
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the disk image
        uses: actions/upload-artifact@v7
        with:
          name: fuse-macos-${{ matrix.arch }}
          path: build/macos/*.dmg
          if-no-files-found: error
          retention-days: 14
