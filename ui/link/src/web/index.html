<div id="boot" class="boot" role="status" aria-live="polite">
  <svg class="boot-mark" aria-hidden="true"><use href="#fuse-mark"/></svg>
  <div id="boot-msg" class="boot-msg" hidden>
    <h1 class="boot-title">Can't reach Fuse</h1>
    <p id="boot-text" class="boot-text"></p>
    <button id="boot-retry" class="btn btn-secondary" type="button"><svg class="i" aria-hidden="true"><use href="#i-refresh-cw"/></svg><span>Try again</span></button>
  </div>
</div>

<section id="signin" class="signin" aria-labelledby="signin-title" hidden>
  <div class="room-glow" aria-hidden="true"></div>
  <div class="signin-inner">
    <svg class="brand-mark" aria-hidden="true"><use href="#fuse-mark"/></svg>
    <h1 id="signin-title" class="signin-title">Phone Link</h1>
    <p id="signin-sub" class="signin-sub">Sign in to manage your Fuse library.</p>
    <form id="signin-form" class="card signin-card" novalidate>
      <div id="signin-note" class="alert alert-info" role="status" hidden>
        <svg class="i" aria-hidden="true"><use href="#i-info"/></svg>
        <div class="alert-body"><p id="signin-note-text" class="alert-text"></p></div>
      </div>
      <div class="field">
        <label class="field-label" for="su-user">Username</label>
        <div class="input">
          <svg class="i" aria-hidden="true"><use href="#i-user"/></svg>
          <input id="su-user" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" required>
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="su-pass">Password</label>
        <div class="input">
          <svg class="i" aria-hidden="true"><use href="#i-lock"/></svg>
          <input id="su-pass" name="password" type="password" autocomplete="current-password" enterkeyhint="go" required>
          <button id="su-eye" class="input-btn" type="button" aria-label="Show password" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-eye"/></svg></button>
        </div>
      </div>
      <div id="signin-error" class="alert alert-danger" role="alert" hidden>
        <svg class="i" aria-hidden="true"><use href="#i-circle-alert"/></svg>
        <div class="alert-body">
          <p id="signin-error-text" class="alert-text"></p>
          <p id="signin-countdown" class="alert-sub" hidden></p>
        </div>
      </div>
      <button id="su-submit" class="btn btn-primary btn-lg btn-block" type="submit"><span class="btn-label">Sign in</span></button>
    </form>
    <p class="signin-help">The username and password are set on the device, in Settings, Phone Link.</p>
    <p id="signin-foot" class="signin-foot"></p>
  </div>
</section>

<div id="shell" class="shell" hidden>
  <main id="main">
    <section id="tab-now" class="tab" data-tab="now" aria-labelledby="h-now">
      <header class="topbar">
        <h1 id="h-now" class="page-title">Now</h1>
        <div class="conn" data-conn data-state="connecting"><span class="conn-dot" aria-hidden="true"></span><span class="conn-label"></span></div>
      </header>
      <div id="now-body" class="tab-body"></div>
    </section>

    <section id="tab-library" class="tab" data-tab="library" aria-labelledby="h-library" hidden>
      <header class="topbar">
        <h1 id="h-library" class="page-title">Library</h1>
        <div class="conn" data-conn data-state="connecting"><span class="conn-dot" aria-hidden="true"></span><span class="conn-label"></span></div>
      </header>
      <div id="lib-stick" class="lib-stick" aria-hidden="true"></div>
      <div id="lib-bar" class="lib-bar">
        <div class="lib-bar-inner">
          <div class="search" role="search">
            <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
            <input id="lib-q" type="search" placeholder="Search your library" aria-label="Search your library" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
            <button id="lib-q-clear" class="input-btn" type="button" aria-label="Clear search" hidden><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
          </div>
          <div id="lib-chips" class="chips" role="group" aria-label="Filter by system"></div>
        </div>
      </div>
      <div class="lib-meta">
        <p id="lib-count" class="lib-count" aria-live="polite"></p>
        <button id="lib-sort" class="sort-btn" type="button" aria-haspopup="dialog">
          <svg class="i" aria-hidden="true"><use href="#i-arrow-up-down"/></svg>
          <span id="lib-sort-label">Title</span>
          <svg class="i i-sm" aria-hidden="true"><use href="#i-chevron-down"/></svg>
        </button>
      </div>
      <div id="lib-grid" class="grid" aria-label="Games"></div>
      <div id="lib-status" class="lib-status"></div>
      <div id="lib-sentinel" class="lib-sentinel" aria-hidden="true"></div>
    </section>

    <section id="tab-captures" class="tab" data-tab="captures" aria-labelledby="h-captures" hidden>
      <header class="topbar">
        <h1 id="h-captures" class="page-title">Captures</h1>

          <button id="cap-download" class="btn btn-primary" type="button" disabled><svg class="i" aria-hidden="true"><use href="#i-download"/></svg><span class="btn-label">Download</span></button>

      </div>

    <section id="tab-tools" class="tab" data-tab="tools" aria-labelledby="h-tools" hidden>

      <button class="tab-btn" type="button" data-tab="library"><svg class="i" aria-hidden="true"><use href="#i-library"/></svg><span>Library</span></button>
