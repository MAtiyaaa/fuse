# Publishes a GitHub release: the Android APK first, as soon as it is built, then the Linux AppImage,
# the Windows installer and portable zip, and the macOS disk images (Apple silicon and Intel) as each
# finishes, and finally SHA256SUMS.txt for everything there.
#
# Runs when gradle.properties or docs/releases/ changes on main, when a v* tag is pushed, or by hand. The version and
# release name come from fuse.version and fuse.releaseName in gradle.properties, and the release notes
# from docs/releases/<version>.md. Nothing is published when release v<version> already exists,
# unless the run was started by pushing that tag. Started by hand with "desktop_only", it builds the
# Linux, Windows and macOS packages again and adds them to the existing release (a failed or late
# desktop build), leaving the APK alone.
#
# A release created here with GITHUB_TOKEN also creates its tag; GitHub does not start new workflow
# runs for events caused by GITHUB_TOKEN, so that tag does not trigger this workflow again.

name: Release

on:
  push:
    branches:
      - main
    paths:
      - gradle.properties
      # New release notes are the other signal (the first release arrives with its notes, while
      # fuse.version was already set).
      - docs/releases/**
    # Path filters are not applied to tag pushes, so every v* tag starts a run.
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      desktop_only:
        description: "Add the Linux, Windows and macOS builds to the existing release of this version"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Read version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_name: ${{ steps.meta.outputs.release_name }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
      desktop: ${{ steps.meta.outputs.desktop }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Read version and check for an existing release
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_ONLY: ${{ inputs.desktop_only || false }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^fuse\.version=//p' gradle.properties | tr -d '[:space:]')"
          release_name="$(sed -n 's/^fuse\.releaseName=//p' gradle.properties | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.]+)?$'; then
            echo "::error file=gradle.properties::fuse.version is missing or not a version: '$version'"
            exit 1
          fi
          if [ -z "$release_name" ]; then
            echo "::error file=gradle.properties::fuse.releaseName is missing"
            exit 1
          fi
          tag="v$version"
          notes="docs/releases/$version.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Release notes $notes are missing. Add them before releasing $tag."
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match fuse.version $version (expected $tag)."
              exit 1
            fi
            publish=true
          elif output="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1)"; then
            echo "::notice::Release $tag already exists; nothing to publish."
            publish=false
          elif printf '%s' "$output" | grep -qi 'not found'; then
            publish=true
          else
            echo "::error::Could not check whether release $tag exists: $output"
            exit 1
          fi

          # Desktop builds go with a new release, or into an existing one when asked to.
          desktop="$publish"
          if [ "$DESKTOP_ONLY" = "true" ]; then
            if [ "$publish" = "true" ]; then
              echo "::error::desktop_only adds builds to an existing release, but $tag doesn't exist yet."
              exit 1
            fi
            desktop=true
          fi

          {
            echo "version=$version"
            echo "release_name=$release_name"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "desktop=$desktop"
          } >> "$GITHUB_OUTPUT"
          echo "Fuse $version - $release_name ($tag), publish: $publish, desktop builds: $desktop"

  android:
    name: Android APK
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: release-${{ needs.prepare.outputs.tag }}-android
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37
        # compileSdk 37 is the "platforms;android-37.0" package. AGP downloads any other build tools
        # it needs, since the SDK licences were accepted above.
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare the signing key
        # Repository secrets (Settings > Secrets and variables > Actions):
        #   ANDROID_KEYSTORE_BASE64    the keystore file, base64 encoded
        #   ANDROID_KEYSTORE_PASSWORD  its password
        #   ANDROID_KEY_ALIAS          the key's alias
        #   ANDROID_KEY_PASSWORD       optional; defaults to the keystore password (PKCS12 keys share it)
        # Every release must be signed with the same key, or Android refuses to update the app.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set, but ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS is missing."
              exit 1
            fi
            keystore="$RUNNER_TEMP/fuse-release.p12"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            {
              echo "FUSE_KEYSTORE_PATH=$keystore"
              echo "FUSE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "FUSE_KEY_ALIAS=$KEY_ALIAS"
              echo "FUSE_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            # The signing certificate's fingerprint, to check the built APK against.
            expected="$(keytool -list -v -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
              | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            if [ -z "$expected" ]; then
              echo "::error::Could not read the key from the keystore. Check the password and alias secrets."
              exit 1
            fi
            echo "FUSE_EXPECTED_CERT_SHA256=$expected" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so the APK is signed with a debug key. Installed copies will not accept later releases signed with the real key."
          fi

      - name: Build the release APK
        run: ./gradlew :app:android:assembleRelease --stacktrace

      - name: Check the APK signature
        if: env.FUSE_EXPECTED_CERT_SHA256 != ''
        run: |
          set -euo pipefail
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          apk="$(ls app/android/build/outputs/apk/release/*.apk | head -1)"
          certs="$("$apksigner" verify --print-certs "$apk")"
          # Older apksigner prints "Signer #1 certificate SHA-256 digest: ...", build-tools 37 prints
          # "V2 Signer: certificate SHA-256 digest: ...".
          actual="$(printf '%s\n' "$certs" | sed -nE 's/^(Signer #1|V[0-9.]+ Signer:) certificate SHA-256 digest: //p' | head -1)"
          if [ "$actual" != "$FUSE_EXPECTED_CERT_SHA256" ]; then
            echo "::error::The APK is not signed with the release key (expected $FUSE_EXPECTED_CERT_SHA256, got ${actual:-nothing})."
            printf '%s\n' "$certs"
            exit 1
          fi
          echo "Signed with the release key, certificate SHA-256 $actual"

      - name: Collect the APK
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/android/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK found in app/android/build/outputs/apk/release/"
            exit 1
          fi
          apk="${apks[0]}"
          if [ "${#apks[@]}" -gt 1 ]; then
            universal=(app/android/build/outputs/apk/release/*universal*.apk)
            if [ "${#universal[@]}" -ne 1 ]; then
              echo "::error::Several APKs were built and none is a single universal APK: ${apks[*]}"
              exit 1
            fi
            apk="${universal[0]}"
          fi
          case "$apk" in
            *unsigned*) echo "::warning::$apk is not signed with the release key." ;;
          esac
          mkdir -p dist
          cp "$apk" "dist/Fuse-$VERSION-android.apk"
          ls -l dist

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/fuse-release.p12"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: fuse-android
          path: dist/Fuse-${{ needs.prepare.outputs.version }}-android.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release (APK)
    needs: [prepare, android]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-${{ needs.prepare.outputs.tag }}-publish
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download the APK
        uses: actions/download-artifact@v8
        with:
          name: fuse-android
          path: dist

      - name: Write SHA256SUMS.txt
        # The APK's for now; the checksums job rewrites it once the desktop builds are attached.
        run: |
          set -euo pipefail
          cd dist
          if [ ! -f "Fuse-$VERSION-android.apk" ]; then
            echo "::error::Fuse-$VERSION-android.apk is missing"
            exit 1
          fi
          sha256sum "Fuse-$VERSION-android.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Fuse ${{ needs.prepare.outputs.version }} - ${{ needs.prepare.outputs.release_name }}
          body_path: docs/releases/${{ needs.prepare.outputs.version }}.md
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: "true"
          fail_on_unmatched_files: true
          files: |
            dist/Fuse-${{ needs.prepare.outputs.version }}-android.apk
            dist/SHA256SUMS.txt

  linux:
    name: Linux AppImage
    needs: prepare
    if: needs.prepare.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: release-${{ needs.prepare.outputs.tag }}-linux
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Gradle configures every module, including the Android ones, so the desktop build needs the SDK too.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37
        run: sdkmanager --install "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install FUSE 2 for AppImage tools
        run: |
          set -euo pipefail
          sudo apt-get update
          # Ubuntu 24.04 and later call the package libfuse2t64; older releases call it libfuse2.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Build the AppImage
        run: |
          set -euo pipefail
          if [ ! -f scripts/build-appimage.sh ]; then
            echo "::error::scripts/build-appimage.sh is missing"
            exit 1
          fi
          bash scripts/build-appimage.sh

      - name: Collect the AppImage
        run: |
          set -euo pipefail
          appimage="build/appimage/Fuse-$VERSION-x86_64.AppImage"
          if [ ! -f "$appimage" ]; then
            echo "::error::$appimage was not produced"
            ls -l build/appimage || true
            exit 1
          fi
          mkdir -p dist
          cp "$appimage" dist/
          chmod +x "dist/Fuse-$VERSION-x86_64.AppImage"
          ls -l dist

      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: fuse-linux
          path: dist/Fuse-${{ needs.prepare.outputs.version }}-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows installer and zip
    needs: prepare
    if: needs.prepare.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: release-${{ needs.prepare.outputs.tag }}-windows
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37
        run: sdkmanager --install "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the installer and the portable zip
        # The Compose plugin downloads the WiX toolset it builds the .msi with.
        run: bash scripts/build-windows.sh

      - name: Upload the Windows builds
        uses: actions/upload-artifact@v7
        with:
          name: fuse-windows
          path: |
            build/windows/Fuse-${{ needs.prepare.outputs.version }}-windows-x64.msi
            build/windows/Fuse-${{ needs.prepare.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    concurrency:
      group: release-${{ needs.prepare.outputs.tag }}-macos-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        # The runner's own architecture, which jpackage bundles into Fuse.app.
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37
        run: sdkmanager --install "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the disk image
        run: |
          set -euo pipefail
          bash scripts/build-macos.sh
          test -f "build/macos/Fuse-${{ needs.prepare.outputs.version }}-macos-${{ matrix.arch }}.dmg"

      - name: Upload the disk image
        uses: actions/upload-artifact@v7
        with:
          name: fuse-macos-${{ matrix.arch }}
          path: build/macos/Fuse-${{ needs.prepare.outputs.version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7

  # Each desktop build joins the release once it and the release are both there. With desktop_only
  # there is no release job; the release already exists.
  attach-linux:
    name: Attach Linux
    needs: [prepare, release, linux]
    if: always() && needs.linux.result == 'success' && (needs.release.result == 'success' || needs.prepare.outputs.publish == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the AppImage
        uses: actions/download-artifact@v8
        with:
          name: fuse-linux
          path: dist
      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  attach-windows:
    name: Attach Windows
    needs: [prepare, release, windows]
    if: always() && needs.windows.result == 'success' && (needs.release.result == 'success' || needs.prepare.outputs.publish == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the Windows builds
        uses: actions/download-artifact@v8
        with:
          name: fuse-windows
          path: dist
      - name: Add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  attach-macos:
    name: Attach macOS
    needs: [prepare, release, macos]
    # Whichever Mac builds finished: one failing doesn't hold back the other.
    if: always() && needs.prepare.outputs.desktop == 'true' && (needs.release.result == 'success' || needs.prepare.outputs.publish == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the disk images
        uses: actions/download-artifact@v8
        with:
          pattern: fuse-macos-*
          path: dist
          merge-multiple: true
      - name: Add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.dmg)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::No macOS build finished; nothing to attach."
            exit 0
          fi
          gh release upload "${{ needs.prepare.outputs.tag }}" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    name: Update SHA256SUMS.txt
    needs: [prepare, release, attach-linux, attach-windows, attach-macos]
    if: always() && needs.prepare.outputs.desktop == 'true' && (needs.release.result == 'success' || needs.prepare.outputs.publish == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checksum every build in the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd dist
          gh release download "${{ needs.prepare.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern "Fuse-$VERSION-*"
          sha256sum Fuse-"$VERSION"-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${{ needs.prepare.outputs.tag }}" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
