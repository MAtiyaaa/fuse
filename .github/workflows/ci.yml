# Tests the shared core, builds the Android debug APK and compiles the desktop app for every pull
# request and every push to a branch other than main. Releases are handled by release.yml.

name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37
        # compileSdk 37 is the "platforms;android-37.0" package. AGP downloads any other build tools
        # it needs, since the SDK licences were accepted above.
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Shared modules have a JVM target named "desktop", so their commonTest and desktopTest
      # sources run in the desktopTest task (see build-logic/src/main/kotlin/fuse.kmp.library.gradle.kts).
      - name: Test, build the debug APK, compile the desktop app
        run: >-
          ./gradlew --stacktrace
          :core:model:desktopTest
          :core:library:desktopTest
          :core:launch:desktopTest
          :core:integrations:desktopTest
          :core:data:desktopTest
          :ui:shell:compileKotlinDesktop
          :app:android:assembleDebug
          :app:desktop:compileKotlin

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: fuse-debug-apk
          path: app/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
